<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FBA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#E9EDEC;--card:#fff;--ink:#16211F;--mute:#5E6F6B;--line:#DCE4E2;--brand:#0F6B4F;--on:#fff;--chip:#EEF2F1;--red:#D8452F;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1210;--card:#16211E;--ink:#E8F0EE;--mute:#93A5A0;--line:#27362F;--brand:#3FB88F;--on:#06201A;--chip:#22312C;--red:#FF6B55}:root:not([data-theme="light"]) .logo{filter:invert(1);mix-blend-mode:screen}}
:root[data-theme="dark"]{--bg:#0B1210;--card:#16211E;--ink:#E8F0EE;--mute:#93A5A0;--line:#27362F;--brand:#3FB88F;--on:#06201A;--chip:#22312C;--red:#FF6B55}
:root[data-theme="dark"] .logo{filter:invert(1);mix-blend-mode:screen}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Figtree",system-ui,sans-serif}
.wrap{max-width:560px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px;padding:8px 12px}
.logo{height:34px;width:auto;display:block;mix-blend-mode:multiply}
.sp{flex:1}
.ib{width:38px;height:38px;border-radius:50%;border:0;background:var(--chip);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.ib.flat{background:none}
.tabs{display:flex}
.tab{flex:1;position:relative;height:46px;border:0;border-bottom:3px solid transparent;background:none;color:var(--mute);display:grid;place-items:center;cursor:pointer;padding:0}
.tab.on{color:var(--brand);border-color:var(--brand)}
.badge{position:absolute;top:3px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
svg.i{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.sec{background:var(--card);margin-bottom:8px}
.comp{display:flex;gap:10px;align-items:center;padding:12px}
.pill{flex:1;min-width:0;border:1px solid var(--line);border-radius:999px;padding:9px 16px;font:inherit;background:var(--card);color:var(--ink)}
.go{border:0;background:var(--brand);color:var(--on);border-radius:999px;padding:8px 14px;font:inherit;font-weight:700;cursor:pointer}
.go[hidden]{display:none}
.av{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700}
.av.sm{width:30px;height:30px;font-size:13px}
.stories{display:flex;gap:8px;overflow-x:auto;padding:0 12px 12px;scrollbar-width:none}
.st{flex:none;width:108px;height:190px;border-radius:12px;position:relative;overflow:hidden;border:1px solid var(--line);color:#fff;cursor:pointer;padding:0;font:inherit;text-align:left}
.ring{position:absolute;top:8px;left:8px;width:34px;height:34px;border-radius:50%;border:3px solid var(--brand);background:rgba(0,0,0,.35);display:grid;place-items:center;font-weight:700;font-size:13px}
.nm{position:absolute;left:8px;right:8px;bottom:8px;font-weight:700;font-size:13px;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.cs{background:var(--card);color:var(--ink)}
.cs .pic{height:70%;display:grid;place-items:center;color:#fff;font-size:44px;font-weight:700}
.cs .nm{text-align:center;text-shadow:none}
.plus{position:absolute;left:50%;top:70%;transform:translate(-50%,-50%);width:36px;height:36px;border-radius:50%;background:var(--brand);color:var(--on);border:3px solid var(--card);display:grid;place-items:center;font-size:22px;line-height:1}
.ph{display:flex;gap:10px;padding:12px 12px 0;align-items:center}
.name{font-weight:700;line-height:1.2}
.meta{color:var(--mute);font-size:13px}
.x{padding:10px 12px;overflow-wrap:anywhere;white-space:pre-wrap}
.media{display:block;width:100%;height:auto}
.cnt{display:flex;justify-content:space-between;color:var(--mute);font-size:14px;padding:10px 12px}
.acts{display:flex;border-top:1px solid var(--line);margin:0 12px}
.act{flex:1;border:0;background:none;color:var(--mute);font:inherit;font-weight:700;padding:10px 4px;display:flex;gap:6px;align-items:center;justify-content:center;cursor:pointer}
.act svg{width:22px;height:22px}
.act.on{color:var(--brand)}
.cm{padding:4px 12px 12px;display:grid;gap:8px}
.bub{background:var(--chip);border-radius:14px;padding:6px 12px;overflow-wrap:anywhere}
.cr{display:flex;gap:8px;align-items:center}
.cr input{flex:1;min-width:0;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font:inherit;background:var(--card);color:var(--ink)}
.soon{padding:48px 16px;text-align:center;color:var(--mute)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--card);padding:9px 16px;border-radius:999px;font-size:14px;z-index:9}
.toast[hidden]{display:none}
input:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
[hidden]{display:none!important}
.auth{min-height:100vh;display:grid;place-items:center;padding:20px 14px}
.acard{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;display:grid;gap:12px}
.acard h1{font-size:22px;margin:0}
.logo.big{height:56px;margin:0 auto}
.f{display:grid;gap:4px;font-weight:500;font-size:14px}
.f input,.f select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.err{color:var(--red);margin:0;min-height:1.2em;font-size:14px}
.wide{width:100%;padding:12px}
.sw{margin:0;text-align:center;color:var(--mute);font-size:14px}
.lnk{border:0;background:none;color:var(--brand);font:inherit;font-weight:700;cursor:pointer;padding:0}
.hd{font-weight:700;font-size:18px;padding:12px}
.li{display:flex;gap:10px;align-items:center;padding:10px 12px;border:0;border-top:1px solid var(--line);width:100%;text-align:left;background:var(--card);color:var(--ink);font:inherit}
.grow{flex:1;min-width:0}
.note.new{background:var(--chip);font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 12px 12px}
.ph2{height:120px;border-radius:10px;margin-bottom:6px}
.vcard{padding-bottom:12px}
.vcard video{width:100%;max-height:70vh;background:#000;display:block}
.vcard .meta{padding:6px 12px}
.pad{padding:0 12px 12px}
.addv{display:inline-block;cursor:pointer}
.soon{padding:32px 16px;text-align:center;color:var(--mute);margin:0}
.pf{display:grid;gap:4px;padding:16px 12px}
.pf .av{width:72px;height:72px;font-size:30px;margin-bottom:6px}
.r2{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding:8px 0}
.go.alt{background:var(--chip);color:var(--ink)}

</style>
</head>

<div class="wrap" id="app" hidden>

</header>
<main>
  <div id="home">
    <section class="sec comp">
      <div class="av" id="myav" style="background:#0F6B4F">Y</div>
      <input class="pill" id="q" placeholder="What's on your mind?" aria-label="New post">
      <button class="go" id="go" hidden>Post</button>
    </section>
    <section class="sec"><div class="stories" id="stories"></div></section>
    <div id="feed"></div>
  </div>
  <div id="soon" hidden></div>
</main>
</div>
<div class="toast" id="toast" hidden>Coming soon</div>
<script>
var IC={
menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',
plus:'<rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8v8M8 12h8"/>',
search:'<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/>',
chat:'<path d="M4 5h16v11H10l-4 4v-4H4z"/>',
home:'<path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/>',
video:'<rect x="3.5" y="5" width="17" height="14" rx="3.5"/><path d="M10 9.2l5 2.8-5 2.8z"/>',
friends:'<circle cx="9" cy="8.5" r="3.2"/><path d="M3 19c.4-3.2 3-5 6-5s5.6 1.8 6 5"/><circle cx="17" cy="9.5" r="2.5"/><path d="M17.5 14.2c2 .2 3.3 1.7 3.5 4.3"/>',
shop:'<path d="M4 9l1.2-4.5h13.6L20 9"/><path d="M5 9v11h14V9"/><path d="M4 9c0 1.7 1.3 2.5 2.7 2.5S9.3 10.7 9.3 9c0 1.7 1.3 2.5 2.7 2.5s2.7-.8 2.7-2.5c0 1.7 1.3 2.5 2.7 2.5S20 10.7 20 9"/>',
bell:'<path d="M6 17v-6a6 6 0 0 1 12 0v6l1.8 2H4.2z"/><path d="M10 21.5h4"/>',
user:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="10" r="3.2"/><path d="M6.5 18.5c1.2-2.6 3.2-3.6 5.5-3.6s4.3 1 5.5 3.6"/>',
like:'<path d="M7 11v9H4v-9zM7 11l4-7c2 0 3 1.4 2.5 3.2L13 10h6.2a1.6 1.6 0 0 1 1.5 2l-2 7a2.2 2.2 0 0 1-2.1 1.6H7"/>'
};
function ic(n){return '<svg class="i" viewBox="0 0 24 24" aria-hidden="true">'+IC[n]+'</svg>'}
var SC=[
'<svg class="media" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Sunrise over green hills"><defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6a24a"/><stop offset="1" stop-color="#f8d79b"/></linearGradient></defs><rect width="400" height="300" fill="url(#g1)"/><circle cx="270" cy="150" r="46" fill="#fff4d6"/><path d="M0 220c70-50 130-40 200-10s140 20 200-20v110H0z" fill="#3c8d6a"/><path d="M0 260c90-30 170-20 250 0s110 0 150-10v50H0z" fill="#0f6b4f"/></svg>',
'<svg class="media" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A pizza on a table"><rect width="400" height="300" fill="#f1e3cf"/><circle cx="200" cy="150" r="112" fill="#e9b04a"/><circle cx="200" cy="150" r="94" fill="#d9503a"/><circle cx="165" cy="120" r="14" fill="#7c2d1f"/><circle cx="232" cy="132" r="14" fill="#7c2d1f"/><circle cx="190" cy="184" r="14" fill="#7c2d1f"/><circle cx="238" cy="188" r="10" fill="#5f9e46"/><circle cx="152" cy="168" r="10" fill="#5f9e46"/></svg>'
];
var COL=['#C2410C','#0E7490','#7C3AED','#B45309','#BE185D'];
var posts=[
{n:'Rahela Begum',t:'2h',x:'Watched the sunrise from the rooftop today. Mornings like this are rare.',s:0,l:12,c:['So beautiful!','Share more photos next time']},
{n:'Dhaka Bites',t:'14h',x:'Fresh from the oven. Come try our new menu!',s:1,l:48,c:[]},
{n:'Sakib Hasan',t:'Yesterday',x:'Can anyone recommend a good book to read this weekend?',s:-1,l:5,c:['Try anything by Humayun Ahmed']}
];
posts.forEach(function(p,i){p.i=i;p.k=false;p.o=false});
var stories=[
{n:'Meraj Hossain',g:'linear-gradient(160deg,#6f9bb8,#cfe0ea 60%,#8a9aa8)'},
{n:'Sv Tech',g:'linear-gradient(160deg,#d94b73,#f3a5b8 60%,#f6c7a0)'},
{n:'Rahela Begum',g:'linear-gradient(160deg,#d9801a,#f3b34a)'}
];
var tabs=[['home','Home'],['video','Reels'],['friends','Friends'],['shop','Marketplace'],['bell','Notifications'],['user','Profile']];
var badges={};
var tab=0;
var $=function(id){return document.getElementById(id)};
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
function col(s){return COL[s.length%COL.length]}
function av(n,sm){return '<div class="av'+(sm?' sm':'')+'" style="background:'+col(n)+'">'+esc(n[0])+'</div>'}
var tt;
function toast(){var t=$('toast');t.hidden=false;clearTimeout(tt);tt=setTimeout(function(){t.hidden=true},1800)}
$('b1').innerHTML=ic('menu');$('bplus').innerHTML=ic('plus');$('b3').innerHTML=ic('search');$('b4').innerHTML=ic('chat');
function renderTabs(){
  $('tabs').innerHTML=tabs.map(function(t,i){
    return '<button class="tab'+(i==tab?' on':'')+'" data-t="'+i+'" aria-label="'+t[1]+'"'+(i==tab?' aria-current="page"':'')+'>'+ic(t[0])+(i==4&&unread()?'<span class="badge">'+unread()+'</span>':'')+'</button>';
  }).join('');
  $('home').hidden=tab!=0;
  $('soon').hidden=tab==0;
  if(tab)renderPanel();
}
function renderStories(){
  $('stories').innerHTML='<button class="st cs" data-soon aria-label="Create story"><div class="pic" style="background:#0F6B4F">'+esc(me.name[0].toUpperCase())+'</div><div class="plus">+</div><div class="nm">Create story</div></button>'
  +stories.map(function(s){return '<button class="st" data-soon style="background:'+s.g+'" aria-label="'+esc(s.n)+' story"><div class="ring">'+esc(s.n[0])+'</div><div class="nm">'+esc(s.n)+'</div></button>'}).join('');
}
function post(p){
  var cm=p.c.map(function(c){return '<div class="cr"><div class="av sm" style="background:#64748B">?</div><div class="bub">'+esc(c)+'</div></div>'}).join('');
  return '<article class="sec"><div class="ph">'+av(p.n)+'<div><div class="name">'+esc(p.n)+'</div><div class="meta">'+esc(p.t)+' · Public</div></div></div>'
  +'<div class="x">'+esc(p.x)+'</div>'+(p.s>=0?SC[p.s]:'')
  +'<div class="cnt"><span>'+(p.l+(p.k?1:0))+' likes</span><span>'+p.c.length+' comments</span></div>'
  +'<div class="acts"><button class="act'+(p.k?' on':'')+'" data-a="like" data-i="'+p.i+'">'+ic('like')+'Like</button><button class="act" data-a="cm" data-i="'+p.i+'">'+ic('chat')+'Comment</button></div>'
  +(p.o?'<div class="cm">'+cm+'<div class="cr"><input data-in="'+p.i+'" placeholder="Write a comment..." aria-label="Write a comment"><button class="go" data-a="send" data-i="'+p.i+'">Send</button></div></div>':'')
  +'</article>';
}
function renderFeed(){$('feed').innerHTML=posts.map(post).join('')}
document.addEventListener('click',function(e){
  var s=e.target.closest('[data-soon]');if(s){toast();return}
  var t=e.target.closest('[data-t]');if(t){tab=+t.dataset.t;renderTabs();return}
  if(e.target.closest('#bplus')){tab=0;renderTabs();$('q').focus();return}
  var b=e.target.closest('[data-a]');if(!b)return;
  var p=posts.filter(function(x){return x.i==b.dataset.i})[0],a=b.dataset.a;
  if(a=='like')p.k=!p.k;
  if(a=='cm')p.o=!p.o;
  if(a=='send'){var inp=document.querySelector('[data-in="'+p.i+'"]'),v=inp.value.trim();if(!v)return;p.c.push(v)}
  renderFeed();
  if(a=='cm'&&p.o){var f=document.querySelector('[data-in="'+p.i+'"]');if(f)f.focus()}
});
$('q').addEventListener('input',function(){$('go').hidden=!$('q').value.trim()});
function send(){
  var v=$('q').value.trim();if(!v)return;
  var id=Math.max.apply(null,posts.map(function(x){return x.i}).concat([-1]))+1;
  posts.unshift({i:id,n:me.name,t:'Just now',x:v,s:-1,l:0,c:[],k:false,o:false});
  $('q').value='';$('go').hidden=true;renderFeed();
}
$('go').addEventListener('click',send);
$('q').addEventListener('keydown',function(e){if(e.key=='Enter')send()});
var LOGO=document.querySelector('.logo').src,me=null,mode='reg',mem={},vids=[],added={};
var folks=[['Rahela Begum','12 mutual friends'],['Sakib Hasan','8 mutual friends'],['Tahmina Akter','5 mutual friends'],['Meraj Hossain','3 mutual friends']];
var notes=[{t:'Welcome to FBA! Add friends and share your first post.',r:false},{t:'Rahela Begum sent you a friend request.',r:false},{t:'Sakib Hasan liked your post.',r:false}];
var items=[['Used smartphone','৳ 12,000','#0E7490'],['Study desk','৳ 3,500','#B45309'],['Bicycle','৳ 8,200','#7C3AED'],['Rice cooker','৳ 2,100','#BE185D']];
function unread(){return notes.filter(function(n){return !n.r}).length}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){if(v===undefined)return mem[k]||null;mem[k]=v}}
function users(){try{return JSON.parse(ls('fba_users')||'[]')}catch(e){return[]}}
function hash(t){return crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)).then(function(b){return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')})}
function fld(id,label,type,ex){return '<label class="f"><span>'+label+'</span><input id="'+id+'" type="'+type+'" '+(ex||'')+'></label>'}
function showAuth(){
  var r=mode=='reg',y=new Date().getFullYear();
  $('auth').hidden=false;$('app').hidden=true;
  $('auth').innerHTML='<div class="acard"><img class="logo big" alt="FBA" src="'+LOGO+'"><h1>'+(r?'Create your account':'Log in')+'</h1>'
  +(r?fld('f_n','Full name','text','autocomplete="name"')+fld('f_e','Email','email','autocomplete="email"')+fld('f_m','Mobile number','tel','autocomplete="tel" inputmode="tel"')
  +'<label class="f"><span>Gender</span><select id="f_g"><option value="">Select</option><option>Male</option><option>Female</option><option>Other</option></select></label>'
  +fld('f_y','Birth year','number','inputmode="numeric" min="1920" max="'+y+'" placeholder="e.g. 1998"')+fld('f_p','Password','password','autocomplete="new-password"')
  :fld('f_e','Email','email','autocomplete="email"')+fld('f_p','Password','password','autocomplete="current-password"'))
  +'<p class="err" id="err" role="alert"></p><button class="go wide" id="sub">'+(r?'Create account':'Log in')+'</button>'
  +'<p class="sw">'+(r?'Already have an account? <button class="lnk" data-mode="login">Log in</button>':'New to FBA? <button class="lnk" data-mode="reg">Create account</button>')+'</p></div>';
}
function bad(m){$('err').textContent=m}
function enter(u){
  me=u;ls('fba_s',u.email);$('auth').hidden=true;$('app').hidden=false;
  $('myav').textContent=u.name[0].toUpperCase();tab=0;renderTabs();renderStories();renderFeed();
}
function submit(){
  var g=function(i){var el=$(i);return el?el.value.trim():''};
  var em=g('f_e').toLowerCase(),pw=$('f_p').value,us=users(),y=new Date().getFullYear();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em))return bad('Enter a valid email address.');
  if(mode=='reg'){
    var nm=g('f_n'),mb=g('f_m').replace(/[^0-9+]/g,''),gd=g('f_g'),yr=+g('f_y');
    if(nm.length<2)return bad('Enter your full name.');
    if(mb.replace('+','').length<10||mb.length>15)return bad('Enter a valid mobile number.');
    if(!gd)return bad('Select your gender.');
    if(!(yr>=1920&&yr<=y-13))return bad('Enter a valid birth year. You must be 13 or older.');
    if(pw.length<6)return bad('Password must be at least 6 characters.');
    if(us.some(function(x){return x.email==em}))return bad('This email is already registered. Log in instead.');
    hash(pw).then(function(h){var u={name:nm,email:em,mobile:mb,gender:gd,year:yr,ph:h};us.push(u);ls('fba_users',JSON.stringify(us));enter(u)});
  }else{
    hash(pw).then(function(h){var u=us.filter(function(x){return x.email==em&&x.ph==h})[0];if(u)enter(u);else bad('Wrong email or password.')});
  }
}
function renderPanel(){
  var h='';
  if(tab==1){
    h='<div class="hd">Reels</div><div class="pad"><label class="go addv">Add video<input type="file" accept="video/*" id="vf" hidden></label></div>'
    +(vids.length?vids.map(function(v){return '<div class="vcard"><video src="'+v.u+'" controls playsinline preload="metadata"></video><div class="meta">'+esc(v.n)+'</div></div>'}).join(''):'<p class="soon">No videos yet. Tap Add video to pick one from your phone.</p>');
  }else if(tab==2){
    h='<div class="hd">People you may know</div>'+folks.map(function(f,i){return '<div class="li">'+av(f[0])+'<div class="grow"><div class="name">'+esc(f[0])+'</div><div class="meta">'+f[1]+'</div></div><button class="go'+(added[i]?' alt':'')+'" data-f="'+i+'">'+(added[i]?'Requested':'Add friend')+'</button></div>'}).join('');
  }else if(tab==3){
    h='<div class="hd">Picks for you</div><div class="grid">'+items.map(function(t){return '<div><div class="ph2" style="background:'+t[2]+'"></div><div class="name">'+t[0]+'</div><div class="meta">'+t[1]+'</div></div>'}).join('')+'</div>';
  }else if(tab==4){
    h='<div class="hd">Notifications</div>'+notes.map(function(n,i){return '<button class="li note'+(n.r?'':' new')+'" data-n="'+i+'">'+esc(n.t)+'</button>'}).join('');
  }else{
    var rows=[['Email',me.email],['Mobile',me.mobile],['Gender',me.gender],['Birth year',me.year],['Posts',posts.filter(function(x){return x.n==me.name}).length]];
    h='<div class="pf">'+av(me.name)+'<div class="hd" style="padding:0">'+esc(me.name)+'</div>'+rows.map(function(r){return '<div class="r2"><span class="meta">'+r[0]+'</span><span>'+esc(String(r[1]))+'</span></div>'}).join('')+'<button class="go alt" data-out style="margin-top:8px">Log out</button></div>';
  }
  $('soon').innerHTML='<div class="sec">'+h+'</div>';
}
document.addEventListener('click',function(e){
  var f=e.target.closest('[data-f]');if(f){added[f.dataset.f]=!added[f.dataset.f];renderPanel();return}
  var n=e.target.closest('[data-n]');if(n){notes[n.dataset.n].r=true;renderTabs();return}
  if(e.target.closest('[data-out]')){ls('fba_s','');me=null;mode='login';showAuth();return}
  var m=e.target.closest('[data-mode]');if(m){mode=m.dataset.mode;showAuth();return}
  if(e.target.closest('#sub'))submit();
});
document.addEventListener('change',function(e){
  if(e.target.id!='vf')return;
  Array.prototype.forEach.call(e.target.files,function(f){vids.unshift({u:URL.createObjectURL(f),n:'Posted by '+me.name})});
  renderPanel();
});
$('auth').addEventListener('keydown',function(e){if(e.key=='Enter'&&e.target.tagName!='BUTTON')submit()});
function boot(){
  var us=users(),e=ls('fba_s'),u=us.filter(function(x){return x.email==e})[0];
  mode=us.length?'login':'reg';
  if(u)enter(u);else showAuth();
}
boot();
</script>
</body>
</html>
